<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfaf6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11100f" media="(prefers-color-scheme: dark)" />

    <!-- The %BIODATA_*% tokens are filled in from data/biodata.json at build
         time (see vite.config.ts), so crawlers and link previews — which never
         run the app — always see the published details. -->
    <title>%BIODATA_TITLE%</title>
    <meta name="description" content="%BIODATA_DESCRIPTION%" />
    <meta name="author" content="%BIODATA_NAME%" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="%BIODATA_TITLE%" />
    <meta property="og:title" content="%BIODATA_TITLE%" />
    <meta property="og:description" content="%BIODATA_DESCRIPTION%" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BIODATA_TITLE%" />
    <meta name="twitter:description" content="%BIODATA_DESCRIPTION%" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- Applies the published theme (and any browser-local override) before
         first paint, so there is no flash of the wrong palette. -->
    <script>
      (function () {
        var published = '%BIODATA_THEME_MODE%';
        var root = document.documentElement;
        root.dataset.accent = '%BIODATA_ACCENT%';

        try {
          var mode = localStorage.getItem('biodata-theme') || published;
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          root.classList.toggle('dark', dark);
        } catch (e) {
          root.classList.toggle('dark', published === 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
        This marriage biodata needs JavaScript enabled to display.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
