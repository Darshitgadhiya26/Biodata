    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- Applies the persisted theme before first paint so there is no flash of
         the wrong palette. Kept inline and tiny on purpose. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('biodata-theme') || 'system';
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage blocked — fall back to the light palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; text-align: center">
